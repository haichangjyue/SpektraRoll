name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      # D062: the Windows job builds without OpenColorIO (a MinGW build takes
      # ~20 minutes); the macOS job installs the Homebrew package so the OCIO
      # code path and test_ocio run for real on every push.
      - name: Install OpenColorIO (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install opencolorio
          echo "OCIO_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -e
          if [ -n "${OCIO_PREFIX:-}" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$OCIO_PREFIX"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            grep -E "error:" build.log | head -20 | sed 's/^/::error::/' || true
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build macOS SwiftUI shell (D073)
        if: runner.os == 'macOS'
        run: |
          set +e
          swift --version
          swift build --package-path ui-macos -c release 2>&1 | tee swift-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:" swift-build.log | head -40 | sed 's/^/::error::/' || true
          fi
          exit "$status"

      - name: Smoke test the CLI
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" version
          "$exe" gen --out chart.png --width 320 --height 180
          "$exe" lut gen --out warm.cube --size 17 --preset warm
          "$exe" lut apply --lut warm.cube --in chart.png --out chart_warm.png
          ls -l chart.png chart_warm.png

      - name: Engine contract (D072)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          "$exe" capabilities --json > capabilities.json
          "$py" -c "import json; d=json.load(open('capabilities.json')); assert d['version']; assert d['preview']['protocol']==2; assert 'catalog' in d['commands']; print('capabilities ok:', d['platform'], d['gpu']['backend'])"
          "$exe" catalog --json > catalog.json
          "$py" -c "import json; d=json.load(open('catalog.json')); assert d['counts']['films']==20, d['counts']; assert d['counts']['papers']==8, d['counts']; print('catalog ok:', d['counts'])"
          printf 'hello\nquit\n' | "$exe" preview > hello.txt
          grep -q '"protocol":2' hello.txt
          cat hello.txt

      - name: Smoke test floating point EXR (D055)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" gen --out chart.exr --width 160 --height 90
          "$exe" lut gen --out warm.cube --size 17 --preset warm
          "$exe" lut apply --lut warm.cube --in chart.png --out chart_warm.exr
          # Read the EXR back through our own reader and write a PNG.
          "$exe" lut apply --lut warm.cube --in chart_warm.exr --out chart_back.png --bits 16
          test -f chart_back.png
          ls -l chart.exr chart_warm.exr chart_back.png

      - name: Smoke test the physical engines (GPU falls back to CPU without a device)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" gen --out chart16.png --width 160 --height 90 --bits 16
          "$exe" lut apply --engine spectral --scan negative --in chart16.png --out spectral.png
          "$exe" lut apply --engine spectral-gpu --scan negative --in chart16.png --out spectral_gpu.png
          # The texture backend must compile to a CPU fallback everywhere (D047).
          "$exe" lut apply --engine spectral-gpu --texture-engine gpu --scan negative \
            --grain 0.4 --halation 0.45 --glare 0.2 --diffusion 0.1 \
            --in chart16.png --out spectral_texture.png
          ls -l spectral.png spectral_gpu.png spectral_texture.png

      - name: OpenColorIO (D062, JSON for the UI in D063)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          cfg=data/ocio/studio-config-v3.0.0_aces-v2.0_ocio-v2.4.ocio
          if "$exe" ocio-info --ocio-config "$cfg" > ocio.txt 2>&1; then
            head -5 ocio.txt
            test -f chart16.png
            "$exe" ocio-info --json --ocio-config "$cfg" > ocio.json
            python3 - <<'PY'
          import json
          info = json.load(open("ocio.json"))
          assert len(info["colorSpaces"]) > 10, len(info["colorSpaces"])
          assert info["linearSpace"], info
          assert info["displays"], info
          print("ocio json:", len(info["colorSpaces"]), "spaces, linear", info["linearSpace"])
          PY
            "$exe" convert --ocio-config "$cfg" --ocio-input "Apple Log" \
              --in chart16.png --out ocio-apple.png --bits 16
            # D081: OCIO no longer forces a CPU spectral fallback; the GPU
            # backend decodes on the CPU and keeps the spectral shader.
            "$exe" lut apply --engine spectral-gpu --ocio-config "$cfg" \
              --ocio-input "S-Log3 S-Gamut3.Cine" --scan negative \
              --in chart16.png --out ocio-gpu.png 2> ocio-gpu.log
            cat ocio-gpu.log
            if grep -q "warning:" ocio-gpu.log; then exit 1; fi
            # D081: --exr-linear with an OCIO display writes pre-display linear.
            "$exe" convert --ocio-config "$cfg" --ocio-display "sRGB - Display" \
              --ocio-view "ACES 2.0 - SDR 100 nits (Rec.709)" --exr-linear \
              --in chart16.png --out ocio-linear.exr
            "$exe" lut bake --ocio-config "$cfg" --ocio-input "ARRI LogC3 (EI800)" \
              --scan negative --out ocio-logc3.cube
            ls -l ocio-apple.png ocio-gpu.png ocio-linear.exr ocio-logc3.cube
          else
            # Windows CI has no OCIO: the stub must say so, not pretend.
            cat ocio.txt
            grep -q "without OpenColorIO" ocio.txt
          fi

      - name: Cinema stocks (D065)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          # Vision3 500T is a T-illuminant film printed on 2383 (K75P viewing).
          "$exe" lut bake --film data/profiles/kodak_vision3_500t.json \
            --paper data/profiles/kodak_2383.json --scan print --out cine-500t.cube
          # Daylight Vision3 on the alternative print film.
          "$exe" lut bake --film data/profiles/kodak_vision3_250d.json \
            --paper data/profiles/kodak_2393.json --scan print --out cine-250d.cube
          "$exe" lut info --lut cine-500t.cube
          ls -l cine-500t.cube cine-250d.cube

      - name: Reversal direct scan (D067)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          for film in kodak_ektachrome_100 fujifilm_velvia_100 \
                      fujifilm_provia_100f kodak_kodachrome_64; do
            "$exe" lut bake --film "data/profiles/$film.json" --scan slide \
              --out "slide-$film.cube"
          done
          # A positive stock defaults to the direct scan when --scan is omitted.
          "$exe" lut bake --film data/profiles/kodak_ektachrome_100.json --out slide-auto.cube
          "$exe" lut info --lut slide-kodak_ektachrome_100.cube
          # The nonsensical combinations must be rejected, not silently rendered.
          if "$exe" lut bake --film data/profiles/kodak_ektachrome_100.json \
               --scan print --out slide-bad.cube; then exit 1; fi
          if "$exe" lut bake --film data/profiles/kodak_portra_400.json \
               --scan slide --out slide-bad.cube; then exit 1; fi
          ls -l slide-*.cube

      - name: RED R3D stays stub in official builds (D068)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" red-info
          "$exe" red-info --json | grep -q '"built": false'
          "$exe" red-info --json | grep -q 'RED plugin not found'
          # A .r3d path is recognized in every build, but video refuses it with
          # the BYO-SDK / REDCINE-X guidance rather than failing in ffprobe.
          if "$exe" video --lut placeholder.cube --in sample.r3d \
               --out should-not.mov 2> red.txt; then exit 1; fi
          grep -q "RED plugin not found" red.txt
          if "$exe" red-decode --in sample.r3d --out should-not.png 2> red.txt; then exit 1; fi
          grep -q "RED plugin not found" red.txt

      - name: Bake the M1 film LUT and compare with the frozen reference
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" lut bake --out m1.cube
          "$exe" lut compare --a tests/reference/portra400_endura_33.cube --b m1.cube

      - name: Bake the Apple Log variant of the same LUT
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$exe" lut bake --input apple-log --exposure 0.7 --out applelog.cube
          "$exe" lut info --lut applelog.cube
          "$exe" lut bake --input apple-log --exposure 0.7 --scan negative --out negative.cube
          "$exe" lut info --lut negative.cube
          "$exe" lut bake --input apple-log --exposure 0.7 --scan negative --contrast 1.15 --out negative_contrast.cube
          "$exe" lut bake --input apple-log --exposure 0.7 --gamut off --out applelog_nogamut.cube
          "$exe" lut bake --couplers on --out couplers.cube
          "$exe" lut bake --input apple-log --exposure 0.7 --scan negative --hdr pq --peak 1000 --out hdr.cube

      - name: Bake every camera log input (D060/D061)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          for input in s-log3 s-log3-sgamut3 c-log3 v-log logc3 logc4 bmd-film davinci; do
            "$exe" lut bake --input "$input" --scan negative --out "log-$input.cube"
            "$exe" lut info --lut "log-$input.cube"
          done
          # One decode through the physical engine, so the curve is exercised end to end.
          "$exe" gen --out chart16.png --width 160 --height 90 --bits 16
          "$exe" lut apply --engine spectral --input logc4 --scan negative \
            --in chart16.png --out logc4.png
          "$exe" lut apply --engine spectral --input bmd-film --scan negative \
            --in chart16.png --out bmd.png
          ls -l log-*.cube logc4.png bmd.png

      # Both platforms run the pipe path now: the macOS failure we blamed on a
      # missing ffmpeg was actually the popen("rb") bug (issue #1), and brew
      # installs ffmpeg from a bottle in well under a minute.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Video round trip (ffmpeg pipe, range, ProRes, resume, timecode)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          ffmpeg -y -v error -f lavfi -i testsrc2=size=160x90:rate=24 -t 0.5 -pix_fmt yuv420p -timecode 01:00:00:00 ci_src.mov
          "$exe" video --lut m1.cube --in ci_src.mov --out ci_out.mov --trc srgb --in-matrix bt709
          "$exe" video --lut m1.cube --in ci_src.mov --out ci_trim.mov --trc srgb --in-matrix bt709 --start 0.1 --frames 6 --codec prores
          "$exe" video --lut m1.cube --in ci_src.mov --out ci_texture.mov --trc srgb --in-matrix bt709 --grain 0.3 --halation 0.4 --glare 0.2 --diffusion 0.1
          "$exe" video --lut m1.cube --in ci_src.mov --out ci_seg.mov --trc srgb --in-matrix bt709 --duration 0.5 --segment 0.2 --resume
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nw=1:nk=1 ci_seg.mov | head -n 1)" = "12"
          ffprobe -v error -show_entries stream_tags=timecode -of default=nw=1:nk=1 ci_seg.mov | grep -q 01:00:00:00
          "$exe" gen --out ci_frame.png --width 160 --height 90
          "$exe" lut apply --engine spectral --input srgb --in ci_frame.png --out ci_spectral.png
          test -f ci_spectral.png
          "$exe" video --engine spectral --input srgb --in ci_src.mov --out ci_spec.mov --trc srgb --in-matrix bt709 --frames 4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nw=1:nk=1 ci_spec.mov | head -n 1)" = "4"
          ffprobe -v error -show_entries stream=codec_name,nb_frames -of default=noprint_wrappers=1 ci_trim.mov

      - name: Preview server protocol (D048)
        shell: bash
        run: |
          set -e
          exe=build/spektra-roll-cli
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          printf 'look --lut m1.cube\nopen ci_src.mov\ntexture 0.4 1.4 1 3 0.45 0.006 0.72 0.2 0.02 0.1 0.004\nframe 1 preview.rgba\nraw 0 original.rgba\nquit\n' \
            | "$exe" preview --ffmpeg ffmpeg --in-matrix bt709 > preview.log 2> preview.err
          cat preview.log
          cat preview.err
          ls -l preview.rgba original.rgba
          grep -q '^ok look lut' preview.log
          grep -q '^ok open 160 90' preview.log
          grep -q '^ok frame 1' preview.log
          grep -q '^ok raw 0' preview.log
          # BSD wc pads its output when reading stdin, so compare numerically.
          test "$(wc -c < preview.rgba)" -eq 57600
          test "$(wc -c < original.rgba)" -eq 57600
